name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:
  test:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud needs the full history to attribute code to authors and
          # to work out what counts as "new code"; a shallow clone breaks both.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # CI=true makes react-scripts run once instead of entering watch mode.
      # Coverage is built into react-scripts, so this needs no extra dependency.
      # text-summary goes to stdout (test results go to stderr), so teeing
      # stdout captures the summary alone for the job summary below.
      - name: Test
        run: |
          set -o pipefail
          CI=true npm test -- --watchAll=false --coverage \
            --coverageReporters=lcov --coverageReporters=text-summary \
            | tee "$RUNNER_TEMP/coverage-summary.txt"

      # Groundwork for SonarCloud, which reads coverage/lcov.info.
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (Jest)"
            echo
            if grep -q 'Coverage summary' "$RUNNER_TEMP/coverage-summary.txt" 2>/dev/null; then
              grep -E '^Lines +:' "$RUNNER_TEMP/coverage-summary.txt" \
                | sed -E 's/^Lines +: +([0-9.]+)% \( *([0-9]+)\/([0-9]+) *\)/**\1% of lines** (\2\/\3)/'
              echo
              echo '```'
              sed -n '/Coverage summary/,$p' "$RUNNER_TEMP/coverage-summary.txt"
              echo '```'
            else
              echo "_No coverage summary was produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jest-coverage
          path: coverage/lcov.info
          if-no-files-found: error

      # Runs after the tests so coverage/lcov.info already exists, and before
      # the build so the scanner never sees the minified bundle. Configuration
      # lives in sonar-project.properties at the repo root.
      #
      # Analysis is advisory, not a gate: continue-on-error keeps a SonarCloud
      # outage or a scanner hiccup from failing the required check.
      - name: SonarCloud analysis
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build
        run: CI=true npm run build

      # The point of the bundle work was the initial download, so surface it
      # on every run rather than only when someone thinks to check.
      - name: Report bundle size
        run: |
          echo "### Bundle sizes (gzip)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in build/static/js/*.js; do
            printf '%8s  %s\n' "$(gzip -c "$f" | wc -c | awk '{printf "%.1f kB", $1/1024}')" "$(basename "$f")"
          done | sort -rh >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
