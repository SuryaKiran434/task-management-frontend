# SonarCloud configuration for CI-based analysis.
#
# Automatic Analysis is switched off for this project: it cannot import test
# coverage. The scan is run from .github/workflows/ci.yml, after the Jest run
# has produced coverage/lcov.info.

sonar.projectKey=SuryaKiran434_task-management-frontend
sonar.organization=suryakiran434

# Analysed code and test code both live under src/, so the two are separated by
# sonar.test.inclusions below rather than by directory.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/testUtils/**

# Kept out of the main-code analysis: specs and test helpers (they are indexed
# as tests instead, above), plus build output and the coverage report itself.
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/testUtils/**,build/**,coverage/**,node_modules/**

# Vitest writes lcov.info via the coverage.reporter list in vite.config.js.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
